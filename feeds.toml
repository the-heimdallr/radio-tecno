  { nombre = "ZDNet", url = "https://www.zdnet.com/topic/artificial-intelligence/rss.xml", idioma = "en", max = 5 },
  { nombre = "OpenAI", url = "https://openai.com/news/rss.xml", idioma = "en", max = 1, horas = 168 },
  { nombre = "Google DeepMind", url = "https://deepmind.google/blog/rss.xml", idioma = "en", max = 1, horas = 168 },
