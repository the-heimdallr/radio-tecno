# Configuración de Radio Tecno. Para sumar o sacar un feed, editá este archivo:
# el código no cambia. Probá el resultado con:  python -m radio --dry-run
#
# El episodio tiene dos partes: primero las fuentes con idioma = "es" y después las de
# idioma = "en" (leídas por la voz en inglés, un poco más despacio, para practicar).
#
# Opciones de cada fuente:
#   max = 3          cuántas noticias como mucho por día (si no, max_por_fuente)
#   horas = 168      ventana de tiempo propia (blogs que publican pocas veces por semana)
#   resumen = false  leer solo el título (Hacker News trae solo enlaces y puntos)
#   repo = true      el título es "dueño/repo" (tendencias de GitHub)
#   filtro = [...]   solo noticias con alguna de esas palabras (para fuentes generales)

[radio]
titulo = "Radio Tecno"
descripcion = "Noticias de IA, Google, Microsoft, NVIDIA, programación, Python, Linux y repos de GitHub: primero en español y después en inglés, para practicar. Unos 30 minutos todas las mañanas. Sin IA: título y texto de cada fuente."
autor = "Radio Tecno"
idioma = "es"
voz_es = "es-AR-ElenaNeural"   # siempre voces de mujer
voz_en = "en-US-AriaNeural"
velocidad_es = "+0%"
velocidad_en = "-10%"          # más lento para entender mejor; "+0%" es la velocidad normal
minutos = 32                   # duración buscada (si las fuentes traen poco, sale más corto)
proporcion_en = 0.7            # parte del episodio en inglés (0.5 = mitad y mitad; lo que sobra pasa al otro idioma)
caracteres_por_minuto = 850    # medido: 30.196 caracteres dieron 35 min 54 s con el inglés al -10%
horas = 36                     # noticias publicadas en las últimas N horas
max_por_fuente = 2
max_caracteres_resumen = 700   # cuánto se lee de cada noticia (unos 40 segundos)
episodios_guardados = 7        # los más viejos se borran del sitio

[[seccion]]
nombre = "Inteligencia artificial"
nombre_en = "Artificial intelligence"
fuentes = [
  { nombre = "Xataka", url = "https://www.xataka.com/tag/inteligencia-artificial/rss2.xml", idioma = "es", max = 3 },
  { nombre = "Genbeta", url = "https://www.genbeta.com/categoria/inteligencia-artificial/rss2.xml", idioma = "es", max = 3 },
